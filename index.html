<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptMe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg overflow-hidden relative">
        <!-- Navigation bar -->
        <nav id="main-nav" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-50 max-w-md mx-auto">
            <button id="nav-swipe" class="flex flex-col items-center p-2 text-gray-500 hover:text-orange-500 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                <span class="text-xs mt-1">Descubrir</span>
            </button>
            <button id="nav-chat" class="flex flex-col items-center p-2 text-gray-500 hover:text-orange-500 transition-colors relative">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                <span class="text-xs mt-1">Chat</span>
                <span id="chat-unread-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
            </button>
        </nav>

        <!-- Swipe view -->
        <div id="swipe-view" class="hidden pb-16">
            <div id="swipe-container" class="relative h-[calc(100vh-80px)]"></div>
        </div>

        <!-- Chat view -->
        <div id="chat-view" class="hidden h-screen pb-16">
            <div id="chat-container" class="h-full"></div>
        </div>

        <!-- Auth prompt (shown when not logged in) -->
        <div id="auth-prompt" class="hidden flex flex-col items-center justify-center min-h-screen p-8 text-center">
            <div class="text-gray-500 text-6xl mb-6">🐾</div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Bienvenido a AdoptMe</h1>
            <p class="text-gray-600 mb-6">Inicia sesión para comenzar</p>
            <a href="login.html" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-8 py-3 rounded-lg transition-colors">
                Iniciar sesión
            </a>
        </div>
    </div>
    <script src="js/app.js" type="module"></script>
</body>
</html>
