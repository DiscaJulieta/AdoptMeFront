<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptMe - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <img src="assets/logo.svg" alt="AdoptMe Logo" class="h-12 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-gray-800">Bienvenido de vuelta</h1>
            <p class="text-gray-500">Encontrá a tu mejor amigo hoy</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all"
                    placeholder="tu@email.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all"
                    placeholder="••••••••">
            </div>

            <div id="error-message" class="hidden text-red-500 text-sm text-center bg-red-50 py-2 rounded-lg">
                Credenciales inválidas. Reintentá.
            </div>

            <button type="submit" id="submit-btn"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-orange-200 transition-all active:scale-95">
                Iniciar Sesión
            </button>
        </form>

        <p class="text-center mt-8 text-sm text-gray-500">
            ¿No tenés cuenta? <a href="#" class="text-orange-500 font-semibold">Registrate</a>
        </p>
    </div>

    <script src="js/auth/login.js" type="module"></script>
</body>
</html>
